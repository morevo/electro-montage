name: Deploy to reg.ru

# Автодеплой без Docker:
#   • frontend — сборка в GitHub Actions, на сервер уезжает только dist (rsync);
#   • backend  — сборка тоже в GitHub Actions: на сервер попадают только
#                собранный dist, package.json, prisma-схема и скрипты запуска.
#                Исходников и git-клона на сервере нет.
#
# MySQL 8 на сервере уже установлен нативно (Docker не нужен и не ставится),
# база и пользователь созданы один раз вручную — см. STEP_BY_STEP_GUIDE.md §4
# и AUTODEPLOY.md.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  # ── Frontend (FTP на хостинг) ──
  REG_RU_HOST: ${{ secrets.REG_RU_HOST }}
  REG_RU_USER: ${{ secrets.REG_RU_USER }}
  REG_RU_PASSWORD: ${{ secrets.REG_RU_PASSWORD }}
  REG_RU_FRONTEND_PATH: ${{ secrets.REG_RU_FRONTEND_PATH }}
  # Как выкладывать статику: ssh (rsync на VPS, по умолчанию) или ftp (FTPS).
  # Не задан → ssh, если есть REG_RU_SSH_HOST, иначе ftp.
  REG_RU_FRONTEND_MODE: ${{ secrets.REG_RU_FRONTEND_MODE }}
  # Строка подключения к MySQL — из неё создаётся backend/.env при первом деплое.
  PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
  # Админ создаётся автоматически на первом деплое, если заданы эти секреты.
  SEED_ADMIN_LOGIN: ${{ secrets.SEED_ADMIN_LOGIN }}
  SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
  # ── Backend (SSH на VPS) ──
  REG_RU_SSH_HOST: ${{ secrets.REG_RU_SSH_HOST }}
  REG_RU_SSH_USER: ${{ secrets.REG_RU_SSH_USER }}
  REG_RU_SSH_KEY: ${{ secrets.REG_RU_SSH_KEY }}
  REG_RU_SSH_PORT: ${{ secrets.REG_RU_SSH_PORT || '22' }}
  REG_RU_BACKEND_PATH: ${{ secrets.REG_RU_BACKEND_PATH }}
  REG_RU_DOMAIN: ${{ secrets.REG_RU_DOMAIN }}

jobs:
  # ──────────────────────────────────────────────
  # FRONTEND: сборка и деплой статики
  # ──────────────────────────────────────────────
  deploy-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # ── Вариант A (по умолчанию): статика прямо на VPS, nginx отдаёт папку ──
      - name: Check SSH secrets
        if: env.REG_RU_SSH_HOST != '' && env.REG_RU_FRONTEND_MODE != 'ftp'
        run: |
          missing=""
          [ -n "$REG_RU_SSH_USER" ]     || missing="$missing REG_RU_SSH_USER"
          [ -n "$REG_RU_SSH_KEY" ]      || missing="$missing REG_RU_SSH_KEY"
          [ -n "$REG_RU_FRONTEND_PATH" ] || missing="$missing REG_RU_FRONTEND_PATH"
          if [ -n "$missing" ]; then
            echo "❌ Не заданы секреты:$missing"
            echo "   Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - name: Setup SSH agent for VPS
        if: env.REG_RU_SSH_HOST != '' && env.REG_RU_FRONTEND_MODE != 'ftp'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.REG_RU_SSH_KEY }}

      - name: Trust VPS host key
        if: env.REG_RU_SSH_HOST != '' && env.REG_RU_FRONTEND_MODE != 'ftp'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${REG_RU_SSH_PORT:-22}" -H "$REG_RU_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Resolve static directory on VPS
        id: static
        if: env.REG_RU_SSH_HOST != '' && env.REG_RU_FRONTEND_MODE != 'ftp'
        run: |
          DEST=$(ssh -p "${REG_RU_SSH_PORT:-22}" "${REG_RU_SSH_USER}@${REG_RU_SSH_HOST}" \
            "D=\"\$HOME/www/${REG_RU_DOMAIN}\"; P='${REG_RU_FRONTEND_PATH}'; case \"\$P\" in /*) : ;; *) P=\"\" ;; esac; if [ -d \"\$D\" ]; then readlink -f \"\$D\"; else echo \"\${P:-\$D}\"; fi")
          echo "dir=$DEST" >> "$GITHUB_OUTPUT"
          echo "Статика → $DEST"

      - name: Ensure static directory exists
        if: env.REG_RU_SSH_HOST != '' && env.REG_RU_FRONTEND_MODE != 'ftp'
        run: |
          ssh -p "${REG_RU_SSH_PORT:-22}" "${REG_RU_SSH_USER}@${REG_RU_SSH_HOST}" \
            "mkdir -p '${{ steps.static.outputs.dir }}'"

      - name: Upload dist to VPS (rsync)
        if: env.REG_RU_SSH_HOST != '' && env.REG_RU_FRONTEND_MODE != 'ftp'
        run: |
          # uploads — это фото портфолио, они живут в веб-корне и не должны
          # удаляться при выкладке статики. api.php — ручной реверс-прокси на
          # Node (см. deploy/api.php): его нет во frontend/dist (не часть
          # сборки), и --delete его стирал на каждом деплое фронтенда, пока не
          # исключили явно. .htaccess исключать не нужно — он лежит в
          # frontend/public/.htaccess и Vite сам кладёт его в dist/, так что
          # каждый деплой корректно его обновляет.
          rsync -az --delete --chmod=D755,F644 \
            --exclude uploads \
            --exclude api.php \
            -e "ssh -p ${REG_RU_SSH_PORT:-22}" \
            ./dist/ \
            "${REG_RU_SSH_USER}@${REG_RU_SSH_HOST}:${{ steps.static.outputs.dir }}/"
          echo "✅ Статика выложена в ${{ steps.static.outputs.dir }}"

      - name: Verify deployed files
        if: env.REG_RU_SSH_HOST != '' && env.REG_RU_FRONTEND_MODE != 'ftp'
        run: |
          CMD="stat -c '%n | %y' '${{ steps.static.outputs.dir }}/index.html'; grep -oE 'assets/index-[A-Za-z0-9_-]+\\.(js|css)' '${{ steps.static.outputs.dir }}/index.html'"
          ssh -p "${REG_RU_SSH_PORT:-22}" "${REG_RU_SSH_USER}@${REG_RU_SSH_HOST}" "$CMD"

      # ── Вариант B: FTPS на shared-хостинг (только если режим ftp) ──
      - name: Deploy to reg.ru via FTP
        if: env.REG_RU_HOST != '' && (env.REG_RU_FRONTEND_MODE == 'ftp' || env.REG_RU_SSH_HOST == '')
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.REG_RU_HOST }}
          username: ${{ env.REG_RU_USER }}
          password: ${{ env.REG_RU_PASSWORD }}
          local-dir: ./frontend/dist/
          server-dir: ${{ env.REG_RU_FRONTEND_PATH }}
          protocol: ftps
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.log
            **/*.map

  # ──────────────────────────────────────────────
  # BACKEND: сборка в CI, на сервер — только билд
  # ──────────────────────────────────────────────
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH secrets
        if: env.REG_RU_SSH_HOST != ''
        run: |
          missing=""
          [ -n "$REG_RU_SSH_USER" ] || missing="$missing REG_RU_SSH_USER"
          [ -n "$REG_RU_SSH_KEY" ]  || missing="$missing REG_RU_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "❌ Не заданы секреты:$missing"
            echo "   Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install and build backend
        working-directory: ./backend
        run: |
          npm ci --include=dev --no-audit --no-fund
          npx prisma generate
          npm run build
          test -f dist/main.js || { echo "❌ dist/main.js не собрался"; exit 1; }

      - name: Setup SSH agent
        if: env.REG_RU_SSH_HOST != ''
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.REG_RU_SSH_KEY }}

      - name: Trust host key
        if: env.REG_RU_SSH_HOST != ''
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${REG_RU_SSH_PORT:-22}" -H "$REG_RU_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Resolve static directory on server
        id: static
        if: env.REG_RU_SSH_HOST != ''
        run: |
          DIR=$(ssh -p "${REG_RU_SSH_PORT:-22}" "${REG_RU_SSH_USER}@${REG_RU_SSH_HOST}" \
            "D=\"\$HOME/www/${REG_RU_DOMAIN}\"; if [ -d \"\$D\" ]; then readlink -f \"\$D\"; else echo \"\$D\"; fi")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Сайт → $DIR"

      - name: Resolve backend directory on server
        id: backend
        if: env.REG_RU_SSH_HOST != ''
        run: |
          APP="$REG_RU_BACKEND_PATH"
          # Секрет может содержать windows-путь — такой игнорируем.
          case "$APP" in /*) : ;; *) APP="" ;; esac
          REMOTE=$(ssh -p "${REG_RU_SSH_PORT:-22}" "${REG_RU_SSH_USER}@${REG_RU_SSH_HOST}" \
            "A='$APP'; [ -n \"\$A\" ] || A=\"\$HOME/apps/electromontage\"; mkdir -p \"\$A\"; echo \"\$A\"")
          echo "dir=$REMOTE" >> "$GITHUB_OUTPUT"
          echo "Бэкенд → $REMOTE"

      - name: Upload build to server (rsync)
        if: env.REG_RU_SSH_HOST != ''
        run: |
          rsync -az --delete --chmod=D755,F644 \
            -e "ssh -p ${REG_RU_SSH_PORT:-22}" \
            --exclude node_modules --exclude .env --exclude logs --exclude uploads --exclude .run --exclude .admin-seeded \
            ./backend/dist ./backend/prisma ./backend/scripts ./backend/package.json ./backend/package-lock.json \
            "${REG_RU_SSH_USER}@${REG_RU_SSH_HOST}:${{ steps.backend.outputs.dir }}/"
          echo "✅ Билд выложен в ${{ steps.backend.outputs.dir }}"

      - name: Ensure portfolio upload dir exists on server
        if: env.REG_RU_SSH_HOST != ''
        run: |
          ssh -p "${REG_RU_SSH_PORT:-22}" "${REG_RU_SSH_USER}@${REG_RU_SSH_HOST}" \
            "mkdir -p '${{ steps.static.outputs.dir }}/uploads/portfolio'"

      - name: Upload portfolio seed (images + manifest)
        if: env.REG_RU_SSH_HOST != ''
        run: |
          # Фото сразу кладём в веб-корень: их раздаёт nginx как статику.
          rsync -az --chmod=D755,F644 \
            -e "ssh -p ${REG_RU_SSH_PORT:-22}" \
            ./frontend/src/assets/portfolio/ \
            "${REG_RU_SSH_USER}@${REG_RU_SSH_HOST}:${{ steps.static.outputs.dir }}/uploads/portfolio/"
          rsync -az --chmod=F644 \
            -e "ssh -p ${REG_RU_SSH_PORT:-22}" \
            ./frontend/src/assets/portfolio-manifest.json \
            "${REG_RU_SSH_USER}@${REG_RU_SSH_HOST}:${{ steps.backend.outputs.dir }}/prisma/portfolio-manifest.json"
          echo "✅ Изображения и манифест портфолио загружены"

      - name: Prepare and restart API on server
        if: env.REG_RU_SSH_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.REG_RU_SSH_HOST }}
          username: ${{ env.REG_RU_SSH_USER }}
          key: ${{ env.REG_RU_SSH_KEY }}
          port: ${{ env.REG_RU_SSH_PORT }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            APP_PATH="${{ steps.backend.outputs.dir }}"
            cd "$APP_PATH"

            # 0. Убираем всё, что осталось от прежнего деплоя «клоном»:
            #    исходники, .git, frontend, доки. На сервере живут только билды.
            if printf '%s' "$APP_PATH" | grep -q '/apps/'; then
              find . -mindepth 1 -maxdepth 1 \
                -not -name dist -not -name node_modules -not -name prisma -not -name scripts \
                -not -name logs -not -name uploads -not -name .run -not -name .env \
                -not -name .admin-seeded \
                -not -name package.json -not -name package-lock.json \
                -exec rm -rf {} + 2>/dev/null || true
            fi

            # Загруженные фото хранятся прямо в веб-корне сайта: nginx отдаёт их
            # как статику. Путь всегда абсолютный, из секретов не берётся.
            UPLOAD_ABS="$HOME/www/${{ env.REG_RU_DOMAIN }}/uploads"
            mkdir -p "$UPLOAD_ABS/portfolio" logs .run
            if grep -q '^UPLOAD_DIR=' .env 2>/dev/null; then
              sed -i "s|^UPLOAD_DIR=.*|UPLOAD_DIR=\"$UPLOAD_ABS\"|" .env
            else
              echo "UPLOAD_DIR=\"$UPLOAD_ABS\"" >> .env
            fi
            echo "UPLOAD_DIR=$UPLOAD_ABS"

            # Старая копия загрузок внутри приложения больше не нужна.
            rm -rf uploads

            # 1. backend/.env создаётся один раз из PROD_DATABASE_URL и живёт на сервере
            if [ ! -f .env ]; then
              if [ -z "${{ env.PROD_DATABASE_URL }}" ]; then
                echo "❌ .env нет, и секрет PROD_DATABASE_URL не задан."
                echo "   Добавьте секрет PROD_DATABASE_URL (mysql://user:pass@127.0.0.1:3306/db)"
                exit 1
              fi
              {
                echo "DATABASE_URL=\"${{ env.PROD_DATABASE_URL }}\""
                echo "JWT_ACCESS_SECRET=\"$(openssl rand -base64 32)\""
                echo "JWT_REFRESH_SECRET=\"$(openssl rand -base64 32)\""
                echo "JWT_ACCESS_TTL=15m"
                echo "JWT_REFRESH_TTL=7d"
                echo "PORT=3001"
                echo "NODE_ENV=production"
                echo "FRONTEND_URL=\"https://${{ env.REG_RU_DOMAIN }}\""
                echo "UPLOAD_DIR=./uploads"
                echo "MAX_FILE_SIZE=10485760"
              } > .env
              chmod 600 .env
              echo "✅ .env создан из PROD_DATABASE_URL"
            fi

            # 2. Node на хостинге по умолчанию старый (v10) — ставим свой в $HOME/runtime
            NODE_VERSION=20.18.1
            case "$(uname -m)" in
              x86_64|amd64) NODE_ARCH=x64 ;;
              aarch64|arm64) NODE_ARCH=arm64 ;;
              *) echo "❌ Неизвестная архитектура: $(uname -m)"; exit 1 ;;
            esac
            NODE_HOME="$HOME/runtime/node-v$NODE_VERSION-linux-$NODE_ARCH"
            if [ ! -x "$NODE_HOME/bin/node" ]; then
              mkdir -p "$HOME/runtime"
              TARBALL="$HOME/runtime/node.tar.xz"
              if curl -fsSL "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-$NODE_ARCH.tar.xz" -o "$TARBALL" && tar -xJf "$TARBALL" -C "$HOME/runtime"; then
                rm -f "$TARBALL"
              else
                curl -fsSL "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-$NODE_ARCH.tar.gz" -o "$HOME/runtime/node.tar.gz"
                tar -xzf "$HOME/runtime/node.tar.gz" -C "$HOME/runtime"
                rm -f "$HOME/runtime/node.tar.gz"
              fi
            fi
            export PATH="$NODE_HOME/bin:$PATH"
            echo "Node: $(node -v), npm: $(npm -v)"

            # 3. Зависимости (нужен prisma CLI для db push и generate)
            npm ci --include=dev --no-audit --no-fund
            ./node_modules/.bin/prisma generate

            # 4. Схема БД
            ./node_modules/.bin/prisma db push --skip-generate

            # 4.1 Портфолио из манифеста (идемпотентно: повторно ничего не создаёт)
            node scripts/seed-portfolio.js || echo "⚠️ портфолио не перенесено"

            # 5. Админ создаётся ОДИН раз — при первом деплое, отмеченном отдельным
            #    маркер-файлом (не .env: он живёт своей жизнью и не должен значить
            #    «ещё не было администратора»). Дальше логин и пароль меняются
            #    исключительно через саму админку (раздел «Администраторы») — иначе
            #    каждый следующий деплой тихо перезаписывал бы пароль, который
            #    администратор сам сменил. Секреты передаются скрипту напрямую через
            #    переменные окружения — в .env они больше не записываются.
            ADMIN_SEEDED_MARKER=".admin-seeded"
            if [ ! -f "$ADMIN_SEEDED_MARKER" ]; then
              if [ -n "${{ env.SEED_ADMIN_LOGIN }}" ] && [ -n "${{ env.SEED_ADMIN_PASSWORD }}" ]; then
                if SEED_ADMIN_LOGIN="${{ env.SEED_ADMIN_LOGIN }}" \
                   SEED_ADMIN_PASSWORD="${{ env.SEED_ADMIN_PASSWORD }}" \
                   node scripts/create-admin.js; then
                  echo "✅ администратор создан"
                  touch "$ADMIN_SEEDED_MARKER"
                else
                  echo "⚠️  администратор не создан — попробую на следующем деплое"
                fi
              else
                echo "⚠️  SEED_ADMIN_LOGIN/SEED_ADMIN_PASSWORD не заданы — создайте администратора вручную"
              fi
            else
              echo "ℹ️  Администратор уже был создан раньше — логин/пароль меняются только через саму админку"
            fi

            # 6. Перезапуск: PID-файл, лог, health-check
            chmod +x scripts/server-start.sh scripts/server-stop.sh scripts/keep-alive.sh scripts/supervise.sh
            bash scripts/server-start.sh

            # 7. Watchdog в cron: хостинг убивает процессы после закрытия
            #    SSH-сессии, а запущенное из cron — живёт.
            CRON_LINE="* * * * * $APP_PATH/scripts/keep-alive.sh >/dev/null 2>&1"
            if command -v crontab >/dev/null 2>&1; then
              ( crontab -l 2>/dev/null | grep -v 'keep-alive.sh' || true; echo "$CRON_LINE" ) | crontab -
              echo "✅ cron: $(crontab -l 2>/dev/null | grep -c 'keep-alive.sh') запись(ей) keep-alive"
            else
              echo "⚠️ crontab недоступен — API придётся поднимать после деплоя вручную"
            fi

            echo "=== содержимое каталога бэкенда ==="
            ls -la "$APP_PATH"

            echo "✅ Бэкенд обновлён"

  # ──────────────────────────────────────────────
  # NOTIFICATION
  # ──────────────────────────────────────────────
  notify:
    needs: [deploy-frontend, deploy-backend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deploy summary
        run: |
          echo "Frontend job: ${{ needs.deploy-frontend.result }}"
          echo "Backend job:  ${{ needs.deploy-backend.result }}"
          echo "Frontend URL: https://${{ secrets.REG_RU_DOMAIN }}"
          echo "API URL:      https://${{ secrets.REG_RU_DOMAIN }}/api"
          if [ "${{ needs.deploy-backend.result }}" = "failure" ] || [ "${{ needs.deploy-frontend.result }}" = "failure" ]; then
            echo "❌ Деплой завершился с ошибкой — смотрите логи job'ов выше"
            exit 1
          fi
          echo "✅ Деплой завершён"
