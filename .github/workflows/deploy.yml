name: Deploy to reg.ru

# Автодеплой без Docker:
#   • frontend — сборка и выгрузка dist на VPS по SSH (rsync) либо по FTPS;
#   • backend  — git pull на VPS, npm ci, prisma db push, nest build и
#                перезапуск Node-процесса через scripts/server-start.sh
#                (PID-файл, без docker и без sudo).
#
# MySQL 8 на сервере уже установлен нативно (Docker не нужен и не ставится),
# база и пользователь созданы один раз вручную — см. STEP_BY_STEP_GUIDE.md §4
# и AUTODEPLOY.md.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  # ── Frontend (FTP на хостинг) ──
  REG_RU_HOST: ${{ secrets.REG_RU_HOST }}
  REG_RU_USER: ${{ secrets.REG_RU_USER }}
  REG_RU_PASSWORD: ${{ secrets.REG_RU_PASSWORD }}
  REG_RU_FRONTEND_PATH: ${{ secrets.REG_RU_FRONTEND_PATH }}
  # Как выкладывать статику: ssh (rsync на VPS, по умолчанию) или ftp (FTPS).
  # Не задан → ssh, если есть REG_RU_SSH_HOST, иначе ftp.
  REG_RU_FRONTEND_MODE: ${{ secrets.REG_RU_FRONTEND_MODE }}
  # Строка подключения к MySQL — из неё создаётся backend/.env при первом деплое.
  PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
  # ── Backend (SSH на VPS) ──
  REG_RU_SSH_HOST: ${{ secrets.REG_RU_SSH_HOST }}
  REG_RU_SSH_USER: ${{ secrets.REG_RU_SSH_USER }}
  REG_RU_SSH_KEY: ${{ secrets.REG_RU_SSH_KEY }}
  REG_RU_SSH_PORT: ${{ secrets.REG_RU_SSH_PORT || '22' }}
  REG_RU_BACKEND_PATH: ${{ secrets.REG_RU_BACKEND_PATH }}
  REG_RU_DOMAIN: ${{ secrets.REG_RU_DOMAIN }}

jobs:
  # ──────────────────────────────────────────────
  # FRONTEND: сборка и деплой по FTP
  # ──────────────────────────────────────────────
  deploy-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # ── Вариант A (по умолчанию): статика прямо на VPS, nginx отдаёт папку ──
      - name: Check SSH secrets
        if: env.REG_RU_SSH_HOST != '' && env.REG_RU_FRONTEND_MODE != 'ftp'
        run: |
          missing=""
          [ -n "$REG_RU_SSH_USER" ]     || missing="$missing REG_RU_SSH_USER"
          [ -n "$REG_RU_SSH_KEY" ]      || missing="$missing REG_RU_SSH_KEY"
          [ -n "$REG_RU_FRONTEND_PATH" ] || missing="$missing REG_RU_FRONTEND_PATH"
          if [ -n "$missing" ]; then
            echo "❌ Не заданы секреты:$missing"
            echo "   Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - name: Setup SSH agent for VPS
        if: env.REG_RU_SSH_HOST != '' && env.REG_RU_FRONTEND_MODE != 'ftp'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.REG_RU_SSH_KEY }}

      - name: Trust VPS host key
        if: env.REG_RU_SSH_HOST != '' && env.REG_RU_FRONTEND_MODE != 'ftp'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${REG_RU_SSH_PORT:-22}" -H "$REG_RU_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Ensure static directory exists
        if: env.REG_RU_SSH_HOST != '' && env.REG_RU_FRONTEND_MODE != 'ftp'
        run: |
          ssh -p "${REG_RU_SSH_PORT:-22}" "${REG_RU_SSH_USER}@${REG_RU_SSH_HOST}" \
            "mkdir -p '$REG_RU_FRONTEND_PATH'"

      - name: Upload dist to VPS (rsync)
        if: env.REG_RU_SSH_HOST != '' && env.REG_RU_FRONTEND_MODE != 'ftp'
        run: |
          rsync -az --delete --chmod=D755,F644 \
            -e "ssh -p ${REG_RU_SSH_PORT:-22}" \
            ./dist/ \
            "${REG_RU_SSH_USER}@${REG_RU_SSH_HOST}:${REG_RU_FRONTEND_PATH}/"
          echo "✅ Статика выложена в ${REG_RU_FRONTEND_PATH} на VPS"

      - name: Verify deployed files
        if: env.REG_RU_SSH_HOST != '' && env.REG_RU_FRONTEND_MODE != 'ftp'
        run: |
          ssh -p "${REG_RU_SSH_PORT:-22}" "${REG_RU_SSH_USER}@${REG_RU_SSH_HOST}" "
            echo \"--- HOME ---\"; echo $HOME
            echo \"--- target ---\"; ls -la '${REG_RU_FRONTEND_PATH}' | head -20
            echo \"--- index ref ---\"; grep -oE 'assets/index-[A-Za-z0-9_-]+.(js|css)' '${REG_RU_FRONTEND_PATH}/index.html'
            echo \"--- nginx root ---\"; grep -rhoE 'root [^;]+' /etc/nginx/sites-enabled/ 2>/dev/null | head -3
          "

      # ── Вариант B: FTPS на shared-хостинг (только если режим ftp) ──
      - name: Deploy to reg.ru via FTP
        if: env.REG_RU_HOST != '' && (env.REG_RU_FRONTEND_MODE == 'ftp' || env.REG_RU_SSH_HOST == '')
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.REG_RU_HOST }}
          username: ${{ env.REG_RU_USER }}
          password: ${{ env.REG_RU_PASSWORD }}
          local-dir: ./frontend/dist/
          server-dir: ${{ env.REG_RU_FRONTEND_PATH }}
          protocol: ftps
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.log
            **/*.map

  # ──────────────────────────────────────────────
  # BACKEND: обновление кода и перезапуск Node на VPS
  # ──────────────────────────────────────────────
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH secrets
        if: env.REG_RU_SSH_HOST != ''
        run: |
          missing=""
          [ -n "$REG_RU_SSH_USER" ] || missing="$missing REG_RU_SSH_USER"
          [ -n "$REG_RU_SSH_KEY" ]  || missing="$missing REG_RU_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "❌ Не заданы секреты:$missing"
            echo "   Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - name: Deploy backend on VPS via SSH
        if: env.REG_RU_SSH_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.REG_RU_SSH_HOST }}
          username: ${{ env.REG_RU_SSH_USER }}
          key: ${{ env.REG_RU_SSH_KEY }}
          port: ${{ env.REG_RU_SSH_PORT }}
          command_timeout: 20m
          script: |
            set -euo pipefail

            # ВАЖНО: скрипт выполняется на самом сервере, поэтому секреты GitHub
            # сюда не попадают как переменные окружения — подставляем их на этапе
            # запуска workflow (${{ env.* }}), а пустое значение добиваем $HOME.
            APP_PATH="${{ env.REG_RU_BACKEND_PATH }}"
            APP_PATH="${APP_PATH:-$HOME/apps/electromontage}"

            # Первый деплой сам делает клон: репозиторий публичный, ключ не нужен.
            if [ ! -d "$APP_PATH/.git" ]; then
              echo "→ git-клона нет, клонирую в $APP_PATH"
              mkdir -p "$(dirname "$APP_PATH")"
              git clone https://github.com/morevo/electro-montage.git "$APP_PATH"
            fi

            cd "$APP_PATH"

            # 0. backend/.env не в репозитории — сохраняем перед reset --hard
            if [ -f backend/.env ]; then
              cp backend/.env "$HOME/.backend.env.backup"
              echo "backend/.env сохранён"
            fi

            # 1. Свежий код
            git fetch --all --prune
            git reset --hard "origin/main" 2>/dev/null || git reset --hard "origin/master"

            if [ ! -f backend/.env ] && [ -f "$HOME/.backend.env.backup" ]; then
              mv "$HOME/.backend.env.backup" backend/.env
              echo "backend/.env восстановлен"
            fi
            # 1.5 Первый деплой сам создаёт backend/.env из секрета PROD_DATABASE_URL.
            #       Дальше файл живёт на сервере и переживает каждый деплой.
            if [ ! -f backend/.env ]; then
              if [ -z "${{ env.PROD_DATABASE_URL }}" ]; then
                echo "❌ backend/.env нет, и секрет PROD_DATABASE_URL не задан."
                echo "   Добавьте секрет PROD_DATABASE_URL (mysql://user:pass@127.0.0.1:3306/db)"
                echo "   или создайте backend/.env вручную по backend/.env.production.example"
                exit 1
              fi
              {
                echo "DATABASE_URL=\"${{ env.PROD_DATABASE_URL }}\""
                echo "JWT_ACCESS_SECRET=\"$(openssl rand -base64 32)\""
                echo "JWT_REFRESH_SECRET=\"$(openssl rand -base64 32)\""
                echo "JWT_ACCESS_TTL=15m"
                echo "JWT_REFRESH_TTL=7d"
                echo "PORT=3001"
                echo "NODE_ENV=production"
                echo "FRONTEND_URL=\"https://${{ env.REG_RU_DOMAIN }}\""
                echo "UPLOAD_DIR=./uploads"
                echo "MAX_FILE_SIZE=10485760"
              } > backend/.env
              chmod 600 backend/.env
              echo "✅ backend/.env создан из PROD_DATABASE_URL"
            fi

            if [ ! -f backend/.env ]; then
              echo "❌ backend/.env не найден — заполните его по backend/.env.production.example"
              exit 1
            fi

            # 2. Node и npm на месте?
            node -v
            npm -v

            # 3. Зависимости и Prisma Client (MySQL)
            cd backend
            mkdir -p uploads/portfolio
            npm ci --no-audit --no-fund
            npx prisma generate

            # 4. Схема БД. Миграций в проекте нет — используем db push.
            #    DATABASE_URL берётся из backend/.env (prisma читает его сам).
            npx prisma db push --skip-generate

            # 5. Сборка
            npm run build

            # 6. Перезапуск без Docker и без root: PID-файл + health-check внутри
            chmod +x scripts/server-start.sh scripts/server-stop.sh
            bash scripts/server-start.sh

            echo "✅ Бэкенд обновлён"

  # ──────────────────────────────────────────────
  # NOTIFICATION
  # ──────────────────────────────────────────────
  notify:
    needs: [deploy-frontend, deploy-backend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deploy summary
        run: |
          echo "Frontend job: ${{ needs.deploy-frontend.result }}"
          echo "Backend job:  ${{ needs.deploy-backend.result }}"
          echo "Frontend URL: https://${{ secrets.REG_RU_DOMAIN }}"
          echo "API URL:      https://${{ secrets.REG_RU_DOMAIN }}/api"
          if [ "${{ needs.deploy-backend.result }}" = "failure" ] || [ "${{ needs.deploy-frontend.result }}" = "failure" ]; then
            echo "❌ Деплой завершился с ошибкой — смотрите логи job'ов выше"
            exit 1
          fi
          echo "✅ Деплой завершён"
