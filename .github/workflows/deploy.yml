name: Deploy to reg.ru

# Автодеплой без Docker и без постоянного процесса:
#   • frontend — сборка в GitHub Actions, на сервер уезжает только dist (rsync);
#   • backend  — PHP. Сборка (composer install) тоже в CI: на сервер попадает
#                готовый каталог api/ без исходников ради сборки. На хостинге
#                PHP запускает Apache/FastCGI по запросу — ни Node-рантайма,
#                ни PID-файлов, ни cron-watchdog'а не нужно.
#
# MySQL 8 на сервере уже установлен нативно, база и пользователь созданы
# один раз вручную — см. docs/PHP_MIGRATION.md и STEP_BY_STEP_GUIDE.md §4.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  # ── Frontend ──
  REG_RU_HOST: ${{ secrets.REG_RU_HOST }}
  REG_RU_USER: ${{ secrets.REG_RU_USER }}
  REG_RU_PASSWORD: ${{ secrets.REG_RU_PASSWORD }}
  REG_RU_FRONTEND_PATH: ${{ secrets.REG_RU_FRONTEND_PATH }}
  # Как выкладывать статику: ssh (rsync, по умолчанию) или ftp (FTPS).
  REG_RU_FRONTEND_MODE: ${{ secrets.REG_RU_FRONTEND_MODE }}
  # Строка подключения к MySQL — из неё создаётся api/.env при первом деплое.
  PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
  # Админ создаётся автоматически на первом деплое, если заданы эти секреты.
  SEED_ADMIN_LOGIN: ${{ secrets.SEED_ADMIN_LOGIN }}
  SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
  # ── SSH ──
  REG_RU_SSH_HOST: ${{ secrets.REG_RU_SSH_HOST }}
  REG_RU_SSH_USER: ${{ secrets.REG_RU_SSH_USER }}
  REG_RU_SSH_KEY: ${{ secrets.REG_RU_SSH_KEY }}
  REG_RU_SSH_PORT: ${{ secrets.REG_RU_SSH_PORT || '22' }}
  REG_RU_BACKEND_PATH: ${{ secrets.REG_RU_BACKEND_PATH }}
  REG_RU_DOMAIN: ${{ secrets.REG_RU_DOMAIN }}

jobs:
  # ──────────────────────────────────────────────
  # FRONTEND: сборка и деплой статики
  # ──────────────────────────────────────────────
  deploy-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # ── Вариант A (по умолчанию): статика прямо на сервере ──
      - name: Check SSH secrets
        if: env.REG_RU_SSH_HOST != '' && env.REG_RU_FRONTEND_MODE != 'ftp'
        run: |
          missing=""
          [ -n "$REG_RU_SSH_USER" ]     || missing="$missing REG_RU_SSH_USER"
          [ -n "$REG_RU_SSH_KEY" ]      || missing="$missing REG_RU_SSH_KEY"
          [ -n "$REG_RU_FRONTEND_PATH" ] || missing="$missing REG_RU_FRONTEND_PATH"
          if [ -n "$missing" ]; then
            echo "❌ Не заданы секреты:$missing"
            echo "   Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - name: Setup SSH agent
        if: env.REG_RU_SSH_HOST != '' && env.REG_RU_FRONTEND_MODE != 'ftp'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.REG_RU_SSH_KEY }}

      - name: Trust host key
        if: env.REG_RU_SSH_HOST != '' && env.REG_RU_FRONTEND_MODE != 'ftp'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${REG_RU_SSH_PORT:-22}" -H "$REG_RU_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Resolve static directory on server
        id: static
        if: env.REG_RU_SSH_HOST != '' && env.REG_RU_FRONTEND_MODE != 'ftp'
        run: |
          DEST=$(ssh -p "${REG_RU_SSH_PORT:-22}" "${REG_RU_SSH_USER}@${REG_RU_SSH_HOST}" \
            "D=\"\$HOME/www/${REG_RU_DOMAIN}\"; P='${REG_RU_FRONTEND_PATH}'; case \"\$P\" in /*) : ;; *) P=\"\" ;; esac; if [ -d \"\$D\" ]; then readlink -f \"\$D\"; else echo \"\${P:-\$D}\"; fi")
          echo "dir=$DEST" >> "$GITHUB_OUTPUT"
          echo "Статика → $DEST"

      - name: Ensure static directory exists
        if: env.REG_RU_SSH_HOST != '' && env.REG_RU_FRONTEND_MODE != 'ftp'
        run: |
          ssh -p "${REG_RU_SSH_PORT:-22}" "${REG_RU_SSH_USER}@${REG_RU_SSH_HOST}" \
            "mkdir -p '${{ steps.static.outputs.dir }}'"

      - name: Upload dist to server (rsync)
        if: env.REG_RU_SSH_HOST != '' && env.REG_RU_FRONTEND_MODE != 'ftp'
        run: |
          # --delete чистит устаревшие ассеты, но НЕ трогает:
          #   uploads — фото портфолио (живут в веб-корне);
          #   api     — PHP-бэкенд (выкладывается job'ом deploy-backend).
          rsync -az --delete --chmod=D755,F644 \
            --exclude uploads \
            --exclude api \
            -e "ssh -p ${REG_RU_SSH_PORT:-22}" \
            ./dist/ \
            "${REG_RU_SSH_USER}@${REG_RU_SSH_HOST}:${{ steps.static.outputs.dir }}/"
          echo "✅ Статика выложена в ${{ steps.static.outputs.dir }}"

      - name: Verify deployed files
        if: env.REG_RU_SSH_HOST != '' && env.REG_RU_FRONTEND_MODE != 'ftp'
        run: |
          CMD="stat -c '%n | %y' '${{ steps.static.outputs.dir }}/index.html'; grep -oE 'assets/index-[A-Za-z0-9_-]+\\\\.(js|css)' '${{ steps.static.outputs.dir }}/index.html'"
          ssh -p "${REG_RU_SSH_PORT:-22}" "${REG_RU_SSH_USER}@${REG_RU_SSH_HOST}" "$CMD"

      # ── Вариант B: FTPS на shared-хостинг (только если режим ftp) ──
      - name: Deploy to reg.ru via FTP
        if: env.REG_RU_HOST != '' && (env.REG_RU_FRONTEND_MODE == 'ftp' || env.REG_RU_SSH_HOST == '')
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.REG_RU_HOST }}
          username: ${{ env.REG_RU_USER }}
          password: ${{ env.REG_RU_PASSWORD }}
          local-dir: ./frontend/dist/
          server-dir: ${{ env.REG_RU_FRONTEND_PATH }}
          protocol: ftps
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.log
            **/*.map

  # ──────────────────────────────────────────────
  # BACKEND: PHP, сборка в CI, на сервер — готовый код
  # ──────────────────────────────────────────────
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH secrets
        if: env.REG_RU_SSH_HOST != ''
        run: |
          missing=""
          [ -n "$REG_RU_SSH_USER" ] || missing="$missing REG_RU_SSH_USER"
          [ -n "$REG_RU_SSH_KEY" ]  || missing="$missing REG_RU_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "❌ Не заданы секреты:$missing"
            echo "   Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, fileinfo, gd
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        working-directory: ./api
        run: composer install --no-dev --optimize-autoloader --classmap-authoritative --no-interaction --no-progress

      - name: Lint PHP sources
        working-directory: ./api
        run: find src bin index.php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Setup SSH agent
        if: env.REG_RU_SSH_HOST != ''
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.REG_RU_SSH_KEY }}

      - name: Trust host key
        if: env.REG_RU_SSH_HOST != ''
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${REG_RU_SSH_PORT:-22}" -H "$REG_RU_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Resolve static directory on server
        id: static
        if: env.REG_RU_SSH_HOST != ''
        run: |
          DIR=$(ssh -p "${REG_RU_SSH_PORT:-22}" "${REG_RU_SSH_USER}@${REG_RU_SSH_HOST}" \
            "D=\"\$HOME/www/${REG_RU_DOMAIN}\"; if [ -d \"\$D\" ]; then readlink -f \"\$D\"; else echo \"\$D\"; fi")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Сайт → $DIR"

      - name: Resolve old backend directory
        id: oldbackend
        if: env.REG_RU_SSH_HOST != ''
        run: |
          APP="$REG_RU_BACKEND_PATH"
          # Секрет может содержать windows-путь — такой игнорируем.
          case "$APP" in /*) : ;; *) APP="" ;; esac
          REMOTE=$(ssh -p "${REG_RU_SSH_PORT:-22}" "${REG_RU_SSH_USER}@${REG_RU_SSH_HOST}" \
            "A='$APP'; [ -n \"\$A\" ] || A=\"\$HOME/apps/electromontage\"; echo \"\$A\"")
          echo "dir=$REMOTE" >> "$GITHUB_OUTPUT"
          echo "Старый Node-каталог (только для миграции .env/маркера) → $REMOTE"

      # Проверяем PHP ДО того, как что-то менять на сервере: если CLI нужной
      # версии нет, деплой останавливается и старый API продолжает работать.
      - name: Check PHP CLI on server
        if: env.REG_RU_SSH_HOST != ''
        run: |
          ssh -p "${REG_RU_SSH_PORT:-22}" "${REG_RU_SSH_USER}@${REG_RU_SSH_HOST}" 'bash -s' <<'REMOTE'
          set -e
          for candidate in php php8.3 php8.2 php8.1 /usr/local/bin/php8.3 /opt/php/8.3/bin/php "$HOME/.php/8.3/bin/php"; do
            if command -v "$candidate" >/dev/null 2>&1 && "$candidate" -r 'exit(PHP_VERSION_ID >= 80100 && extension_loaded("pdo_mysql") ? 0 : 1);' 2>/dev/null; then
              echo "PHP CLI: $("$candidate" -r 'echo PHP_VERSION;')"
              "$candidate" -r 'echo "extensions: pdo_mysql=", extension_loaded("pdo_mysql") ? "ok" : "НЕТ", ", gd=", extension_loaded("gd") ? "ok" : "нет", ", imagick=", extension_loaded("imagick") ? "ok" : "нет", "\n";'
              exit 0
            fi
          done
          echo "❌ Не найден PHP CLI 8.1+ с pdo_mysql — деплой остановлен до изменения файлов."
          echo "   В ISPmanager выберите PHP 8.x для сайта и включите pdo_mysql."
          exit 1
          REMOTE

      - name: Upload API to server (rsync)
        if: env.REG_RU_SSH_HOST != ''
        run: |
          API_DIR="${{ steps.static.outputs.dir }}/api"
          rsync -az --delete --chmod=D755,F644 \
            -e "ssh -p ${REG_RU_SSH_PORT:-22}" \
            --exclude .env \
            --exclude .admin-seeded \
            --exclude uploads \
            --exclude 'storage/*.json' \
            ./api/ \
            "${REG_RU_SSH_USER}@${REG_RU_SSH_HOST}:${API_DIR}/"
          echo "✅ API выложен в ${API_DIR}"

      - name: Ensure upload dirs exist on server
        if: env.REG_RU_SSH_HOST != ''
        run: |
          STORAGE="${{ steps.static.outputs.dir }}"
          ssh -p "${REG_RU_SSH_PORT:-22}" "${REG_RU_SSH_USER}@${REG_RU_SSH_HOST}" \
            "mkdir -p '${STORAGE}/uploads/portfolio' '${STORAGE}/api/storage' && chmod 775 '${STORAGE}/uploads' '${STORAGE}/uploads/portfolio' '${STORAGE}/api/storage' 2>/dev/null || true"

      - name: Upload portfolio seed (images + manifest)
        if: env.REG_RU_SSH_HOST != ''
        run: |
          # Фото сразу кладём в веб-корень: их раздаёт Apache как статику.
          rsync -az --chmod=D755,F644 \
            -e "ssh -p ${REG_RU_SSH_PORT:-22}" \
            ./frontend/src/assets/portfolio/ \
            "${REG_RU_SSH_USER}@${REG_RU_SSH_HOST}:${{ steps.static.outputs.dir }}/uploads/portfolio/"
          rsync -az --chmod=F644 \
            -e "ssh -p ${REG_RU_SSH_PORT:-22}" \
            ./frontend/src/assets/portfolio-manifest.json \
            "${REG_RU_SSH_USER}@${REG_RU_SSH_HOST}:${{ steps.static.outputs.dir }}/api/storage/portfolio-manifest.json"
          echo "✅ Изображения и манифест портфолио загружены"

      - name: Prepare API on server (env, schema, seed)
        if: env.REG_RU_SSH_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.REG_RU_SSH_HOST }}
          username: ${{ env.REG_RU_SSH_USER }}
          key: ${{ env.REG_RU_SSH_KEY }}
          port: ${{ env.REG_RU_SSH_PORT }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            SITE="${{ steps.static.outputs.dir }}"
            API_DIR="$SITE/api"
            OLD_APP="${{ steps.oldbackend.outputs.dir }}"
            cd "$API_DIR"

            # PHP CLI на shared-хостинге: ищем версию 8.1+ с pdo_mysql.
            find_php() {
              for candidate in php php8.3 php8.2 php8.1 /usr/local/bin/php8.3 /opt/php/8.3/bin/php "$HOME/.php/8.3/bin/php"; do
                if command -v "$candidate" >/dev/null 2>&1 && \
                   "$candidate" -r 'exit(PHP_VERSION_ID >= 80100 && extension_loaded("pdo_mysql") ? 0 : 1);' 2>/dev/null; then
                  command -v "$candidate"
                  return 0
                fi
              done
              return 1
            }
            if ! PHP_BIN="$(find_php)"; then
              echo "❌ Не найден PHP CLI 8.1+ с pdo_mysql — миграция и сид не выполнены."
              echo "   Проверьте в ISPmanager: PHP CLI нужной версии и расширение pdo_mysql."
              exit 1
            fi
            echo "PHP CLI: $PHP_BIN ($("$PHP_BIN" -r 'echo PHP_VERSION;'))"

            # 1. .env создаётся ОДИН раз. Секреты JWT переносим из старого .env,
            #    чтобы деплой не разлогинивал всех и не менял подпись между выкатками.
            if [ ! -f .env ]; then
              if [ -z "${{ env.PROD_DATABASE_URL }}" ]; then
                echo "❌ .env нет, и секрет PROD_DATABASE_URL не задан."
                exit 1
              fi

              DB_URL="${{ env.PROD_DATABASE_URL }}"
              ACCESS_SECRET=""
              REFRESH_SECRET=""
              if [ -f "$OLD_APP/.env" ]; then
                ACCESS_SECRET="$(grep -E '^JWT_ACCESS_SECRET=' "$OLD_APP/.env" | head -n1 | cut -d= -f2- | tr -d '\"')"
                REFRESH_SECRET="$(grep -E '^JWT_REFRESH_SECRET=' "$OLD_APP/.env" | head -n1 | cut -d= -f2- | tr -d '\"')"
                OLD_DB_URL="$(grep -E '^DATABASE_URL=' "$OLD_APP/.env" | head -n1 | cut -d= -f2- | tr -d '\"')"
                [ -n "$OLD_DB_URL" ] && DB_URL="$OLD_DB_URL"
              fi
              [ -n "$ACCESS_SECRET" ] || ACCESS_SECRET="$(openssl rand -base64 32)"
              [ -n "$REFRESH_SECRET" ] || REFRESH_SECRET="$(openssl rand -base64 32)"

              {
                echo "DATABASE_URL=\"$DB_URL\""
                echo "JWT_ACCESS_SECRET=\"$ACCESS_SECRET\""
                echo "JWT_REFRESH_SECRET=\"$REFRESH_SECRET\""
                echo "JWT_ACCESS_TTL=15m"
                echo "JWT_REFRESH_TTL=7d"
                echo "APP_ENV=production"
                echo "FRONTEND_URL=\"https://${{ env.REG_RU_DOMAIN }}\""
                echo "UPLOAD_DIR=\"$SITE/uploads\""
                echo "MAX_FILE_SIZE=10485760"
                echo "PORTFOLIO_MANIFEST=\"storage/portfolio-manifest.json\""
              } > .env
              chmod 600 .env
              echo "✅ .env создан (секреты JWT перенесены из старого конфига, если он был)"
            fi

            # Путь к uploads всегда актуален, даже если .env уже существовал.
            if grep -q '^UPLOAD_DIR=' .env; then
              sed -i "s|^UPLOAD_DIR=.*|UPLOAD_DIR=\"$SITE/uploads\"|" .env
            else
              echo "UPLOAD_DIR=\"$SITE/uploads\"" >> .env
            fi

            # 2. Схема БД (идемпотентно; таблицы уже есть — ничего не меняет).
            "$PHP_BIN" bin/migrate.php

            # 3. Портфолио из манифеста (идемпотентно).
            "$PHP_BIN" bin/seed-portfolio.php || echo "⚠️ портфолио не перенесено"

            # 4. Администратор — ОДИН раз, по маркеру. Если старый маркер есть,
            #    переносим его: пароль меняется только через админку.
            if [ -f "$OLD_APP/.admin-seeded" ] && [ ! -f .admin-seeded ]; then
              touch .admin-seeded
            fi
            if [ ! -f .admin-seeded ]; then
              if [ -n "${{ env.SEED_ADMIN_LOGIN }}" ] && [ -n "${{ env.SEED_ADMIN_PASSWORD }}" ]; then
                if SEED_ADMIN_LOGIN="${{ env.SEED_ADMIN_LOGIN }}" \
                   SEED_ADMIN_PASSWORD="${{ env.SEED_ADMIN_PASSWORD }}" \
                   "$PHP_BIN" bin/seed-admin.php; then
                  touch .admin-seeded
                else
                  echo "⚠️  администратор не создан — попробую на следующем деплое"
                fi
              else
                echo "⚠️  SEED_ADMIN_LOGIN/SEED_ADMIN_PASSWORD не заданы — создайте администратора вручную"
              fi
            else
              echo "ℹ️  Администратор уже был создан раньше — логин/пароль меняются только через админку"
            fi

            # 5. Диагностика окружения (не валит деплой, но видна в логе).
            "$PHP_BIN" bin/healthcheck.php || true

            # 6. Уборка старой Node-архитектуры.
            #    PHP не держит процесс, поэтому супервизор, PID-файлы и
            #    cron-watchdog больше не нужны — удаляем их безвозвратно.
            for pidfile in "$OLD_APP"/.run/*.pid; do
              [ -f "$pidfile" ] || continue
              OLD_PID="$(cat "$pidfile" 2>/dev/null || true)"
              if [ -n "$OLD_PID" ] && kill -0 "$OLD_PID" 2>/dev/null; then
                kill "$OLD_PID" 2>/dev/null || true
                sleep 2
                kill -9 "$OLD_PID" 2>/dev/null || true
                echo "⏹  остановлен старый Node-процесс PID $OLD_PID"
              fi
            done

            if command -v crontab >/dev/null 2>&1; then
              KEEP_CRON="$(crontab -l 2>/dev/null | grep -v 'keep-alive.sh' || true)"
              if [ -n "$KEEP_CRON" ]; then
                printf '%s\n' "$KEEP_CRON" | crontab -
              else
                crontab -r 2>/dev/null || true
              fi
              echo "✅ cron очищен от keep-alive.sh"
            fi

            rm -f "$SITE/api.php"

            if [ -n "$OLD_APP" ] && [ "$OLD_APP" != "$API_DIR" ] && [ -d "$OLD_APP" ]; then
              rm -rf "$OLD_APP/dist" "$OLD_APP/node_modules" "$OLD_APP/scripts" \
                     "$OLD_APP/prisma" "$OLD_APP/src" "$OLD_APP/package.json" \
                     "$OLD_APP/package-lock.json" "$OLD_APP/logs" "$OLD_APP/.run" "$OLD_APP/uploads"
              echo "✅ старые Node-файлы удалены из $OLD_APP (сохранён только .env)"
            fi

            echo "=== /api ==="
            ls -la "$API_DIR" | head -20
            echo "✅ PHP-бэкенд обновлён (постоянного процесса нет)"

  # ──────────────────────────────────────────────
  # NOTIFICATION
  # ──────────────────────────────────────────────
  notify:
    needs: [deploy-frontend, deploy-backend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deploy summary
        run: |
          echo "Frontend job: ${{ needs.deploy-frontend.result }}"
          echo "Backend job:  ${{ needs.deploy-backend.result }}"
          echo "Frontend URL: https://${{ secrets.REG_RU_DOMAIN }}"
          echo "API URL:      https://${{ secrets.REG_RU_DOMAIN }}/api"
          if [ "${{ needs.deploy-backend.result }}" = "failure" ] || [ "${{ needs.deploy-frontend.result }}" = "failure" ]; then
            echo "❌ Деплой завершился с ошибкой — смотрите логи job'ов выше"
            exit 1
          fi
          echo "✅ Деплой завершён"
