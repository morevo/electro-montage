name: Diagnose cron (one-off)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check cron and watchdog log
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.REG_RU_SSH_HOST }}
          username: ${{ secrets.REG_RU_SSH_USER }}
          key: ${{ secrets.REG_RU_SSH_KEY }}
          port: ${{ secrets.REG_RU_SSH_PORT || '22' }}
          command_timeout: 8m
          script: |
            set -uo pipefail
            APP="$HOME/apps/electromontage"

            echo "=== crontab ==="
            crontab -l 2>&1 || echo "  пусто/нет"

            echo "=== cron-демоны в системе ==="
            ps -eo pid,args 2>/dev/null | grep -E "[c]ron|[c]rond" | head -5 || echo "  не найдено"
            ls -la /usr/sbin/cron* /usr/sbin/crond 2>/dev/null | head -5 || true
            command -v crontab || echo "  crontab нет"

            echo "=== права watchdog ==="
            ls -la "$APP/scripts/keep-alive.sh"

            echo "=== лог API: записи watchdog ==="
            grep -a "watchdog" "$APP/logs/api.log" | tail -10 || echo "  watchdog не писал"
            echo "=== последние строки лога ==="
            tail -12 "$APP/logs/api.log" 2>/dev/null | tr -d '\000'

            echo "=== порт сейчас ==="
            ss -ltn 2>/dev/null | grep 3001 || echo "  3001 свободен"

            echo "=== ручной запуск watchdog ==="
            bash "$APP/scripts/keep-alive.sh"; echo "  exit=$?"
            sleep 8
            ss -ltn 2>/dev/null | grep 3001 || echo "  порт всё ещё свободен"
            curl -s -o /dev/null -w "  direct: %{http_code}\n" http://127.0.0.1:3001/api/public/categories || true

            echo "=== есть ли systemd --user ==="
            systemctl --user is-system-running 2>&1 | head -2 || echo "  systemd --user недоступен"
            loginctl show-user "$(id -u)" 2>/dev/null | grep -i linger || echo "  linger не проверен"
