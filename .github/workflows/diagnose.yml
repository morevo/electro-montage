name: Diagnose API watchdog (one-off)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect cron and watchdog
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.REG_RU_SSH_HOST }}
          username: ${{ secrets.REG_RU_SSH_USER }}
          key: ${{ secrets.REG_RU_SSH_KEY }}
          port: ${{ secrets.REG_RU_SSH_PORT || '22' }}
          command_timeout: 8m
          script: |
            set -uo pipefail
            APP="$HOME/apps/electromontage"

            echo "=== 1. crontab ==="
            command -v crontab || echo "crontab нет в PATH"
            crontab -l 2>&1 || echo "  (пусто)"

            echo "=== 2. cron-демон ==="
            ps aux | grep -E "[c]ron" | head -5 || echo "  cron не запущен"

            echo "=== 3. лог API (хвост) ==="
            tail -25 "$APP/logs/api.log" 2>/dev/null || echo "  лога нет"

            echo "=== 4. состояние порта ==="
            ss -ltn 2>/dev/null | grep 3001 || echo "  3001 свободен"

            echo "=== 5. ручной запуск watchdog ==="
            bash "$APP/scripts/keep-alive.sh"; echo "  exit=$?"
            sleep 20
            echo "  порт:"; ss -ltn 2>/dev/null | grep 3001 || echo "    не слушается"
            echo "  процесс:"; ps aux | grep "[d]ist/main.js" | head -3 || echo "    нет"
            echo "  health:"; curl -s -o /dev/null -w "    %{http_code}\n" http://127.0.0.1:3001/api/health || true
            echo "=== 6. лог после запуска ==="
            tail -20 "$APP/logs/api.log" 2>/dev/null || true
