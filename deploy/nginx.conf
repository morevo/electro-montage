# ─────────────────────────────────────────────────────────────
# nginx на VPS: статика фронтенда + прокси на Node-бэкенд.
#
# Сервер без Docker: фронтенд — статические файлы из frontend/dist,
# бэкенд — обычный процесс Node на 127.0.0.1:3001 (см. scripts/server-start.sh).
#
# Установка:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/abcn77.ru
#   sudo ln -s /etc/nginx/sites-available/abcn77.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d abcn77.ru -d www.abcn77.ru
#
# Путь к статике и домен поправьте под себя (root / server_name).
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name abcn77.ru www.abcn77.ru;

    # Куда GitHub Actions выкладывает frontend/dist (см. REG_RU_FRONTEND_PATH)
    root /var/www/abcn77.ru;
    index index.html;

    # Загрузка фото пачкой: до 20 файлов по 10 МБ
    client_max_body_size 220m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/xml+rss application/json image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Загруженные фото — отдаёт сам бэкенд (^~ чтобы обойти regex кэша)
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Пакетная загрузка фото может идти долго — не рвём соединение
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Долгоживущий кэш для собранных ассетов Vite (у них хэш в имени)
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|eot|svg|png|jpe?g|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: любые пути отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
