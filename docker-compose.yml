version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: electromontage-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: electromontage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d electromontage"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - electromontage-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: electromontage-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/electromontage?schema=public
      JWT_ACCESS_SECRET: "electro-montage-super-secret-access-key-2024-min-32-chars-long"
      JWT_REFRESH_SECRET: "electro-montage-super-secret-refresh-key-2024-min-32-chars-long"
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL: "7d"
      PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: "http://localhost"
      UPLOAD_DIR: "./uploads"
      MAX_FILE_SIZE: 10485760
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - electromontage-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: electromontage-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - electromontage-network
    restart: unless-stopped

volumes:
  postgres_data:
  backend_uploads:

networks:
  electromontage-network:
    driver: bridge